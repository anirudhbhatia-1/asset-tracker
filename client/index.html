<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AssetTrack — IT Asset Management</title>
    <!-- Apply the saved theme before CSS paints, so dark mode never flashes light.
         Keep in sync with src/context/ThemeContext.jsx (key 'assettrack-theme'). -->
    <script>
      try {
        if (localStorage.getItem('assettrack-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* storage blocked: stay light */ }
    </script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-base text-primary font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
