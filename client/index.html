<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Company logo: browser tab, iPhone/iPad home screen, Android (manifest). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Browser UI colour matches the page background in each theme. -->
    <meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1728" media="(prefers-color-scheme: dark)" />
    <title>AssetTrack — IT Asset Management</title>
    <!-- Apply the saved theme before CSS paints, so dark mode never flashes light.
         Keep in sync with src/context/ThemeContext.jsx (key 'assettrack-theme'). -->
    <!-- Before CSS paints: applies the saved dark theme (external file so the CSP allows it). -->
    <script src="/theme-init.js"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-base text-primary font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
